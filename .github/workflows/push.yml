name: lead-push
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "أرسل إشعار تجربة"
        default: "0"
permissions:
  contents: read
concurrency:
  group: lead-push
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/cache/restore@v4
        with:
          path: push-state.json
          key: push-state-${{ github.run_id }}
          restore-keys: push-state-
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-audit --no-fund --silent web-push@3.6.7
      - run: node tools/push.mjs
        env:
          PUSH_CFG: ${{ secrets.PUSH_CFG }}
          TEST: ${{ inputs.test }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: push-state.json
          key: push-state-${{ github.run_id }}
