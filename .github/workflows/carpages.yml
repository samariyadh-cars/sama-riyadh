name: car-link-previews
on:
  push:
    branches: [main]
    paths: [data.json, app.js, tools/carpages.js]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: carpages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/carpages.js
      - run: |
          git config user.name "sama-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A c sitemap.xml
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "تحديث معاينة روابط السيارات"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 5; done
          exit 1
