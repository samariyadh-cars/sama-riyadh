<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>متابعات سماء</title>
<link rel="manifest" href="https://samariyadh-cars.github.io/sama-riyadh/ops.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="https://samariyadh-cars.github.io/sama-riyadh/ops-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://samariyadh-cars.github.io/sama-riyadh/ops-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="متابعات سماء">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#EEF2F5;color:#132230;font-family:Tahoma,Arial,sans-serif;padding:16px;box-sizing:border-box}
.box{background:#fff;border:1px solid #D7E0E7;border-radius:16px;padding:22px;max-width:380px;width:100%;text-align:center;line-height:1.8}
a,button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 18px;background:#1D6FA8;color:#fff;cursor:pointer;text-decoration:none;display:inline-block;margin-top:10px}
@media (prefers-color-scheme:dark){body{background:#0E161E;color:#E6EDF3}.box{background:#16212C;border-color:#263544}}
</style>
</head>
<body>
<div class="box" id="box">جاري فتح إدارة المعرض…</div>
<script>
(function(){
  var KEY="sama_gh_token",tok="";try{tok=localStorage.getItem(KEY)||""}catch(e){}
  var box=document.getElementById("box");
  function fail(msg){box.innerHTML=msg+'<br><a href="./">الرجوع للموقع</a>'}
  if(!tok){
    box.innerHTML='<b>دخول إدارة المعرض</b><br>المالك: ادخل من آخر صفحة الموقع بزر «دخول المعرض».<br><br><b>الموظف (مشاهدة فقط)</b><br><input id="et" type="password" dir="ltr" placeholder="الصق مفتاح المشاهدة هنا" autocomplete="off" style="width:100%;box-sizing:border-box;padding:10px;border:2px solid #D7E0E7;border-radius:10px;font:inherit;margin-top:8px"><br><button id="eb" type="button">دخول</button><div id="em" style="color:#C0392B;margin-top:6px"></div><br><a href="./" style="background:none;color:#1D6FA8;padding:0">الرجوع للموقع</a>';
    document.getElementById("eb").onclick=function(){var t=(document.getElementById("et").value||"").trim();if(!t)return;
      document.getElementById("em").textContent="";
      fetch("https://api.github.com/repos/samariyadh-cars/sama-data",{headers:{"Authorization":"Bearer "+t}}).then(function(r){
        if(!r.ok){document.getElementById("em").textContent="المفتاح غير صحيح أو ما عنده صلاحية على بيانات المعرض.";return}
        try{localStorage.setItem(KEY,t)}catch(e){}location.reload()}).catch(function(){document.getElementById("em").textContent="تعذر الاتصال، تأكد من الإنترنت."})};
    return}
  fetch("https://api.github.com/repos/samariyadh-cars/sama-data/contents/crm.html?t="+Date.now(),{headers:{"Authorization":"Bearer "+tok,"Accept":"application/vnd.github.raw"},cache:"no-store"})
  .then(function(r){if(r.status===401)throw "مفتاح الدخول غير صحيح أو منتهي.";if(r.status===403||r.status===404)throw "المفتاح ما عنده صلاحية على مستودع sama-data. أضفه للمفتاح من إعدادات GitHub.";if(!r.ok)throw "تعذر الفتح، تأكد من الإنترنت.";return r.text()})
  .then(function(html){document.open();document.write(html);document.close()})
  .catch(function(m){fail(typeof m==="string"?m:"تعذر الفتح، تأكد من الإنترنت.")});
})();
</script>
</body>
</html>
