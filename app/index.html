<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>سماء الرياض للسيارات</title>
<meta name="theme-color" content="#1C1F24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link rel="icon" href="../icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--red:#C8102E;--red-d:#9E0C24;--red-l:#FBE9EC;--ink:#1C1F24;--ink2:#2A2E35;--mut:#5F6670;--bg:#F5F5F6;--card:#FFFFFF;--line:#E4E6E9;--line2:#D7D9DD;--wa:#1E8E4E;--ok-bg:#E3F4EA;--ok:#145F35;--soon-bg:#FBF0DD;--soon:#7A4A08;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif}
body{min-height:100vh;padding-bottom:calc(76px + var(--safe-b))}
a{color:var(--red)}
button,input,select{font:inherit}
.wrap{max-width:560px;margin:0 auto}
/* الشريط العلوي */
.top{background:var(--ink);color:#fff;padding:calc(16px + var(--safe-t)) 16px 18px;border-bottom:3px solid var(--red)}
.top .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:48px;height:48px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.logo{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.logo img{width:40px;height:36px;object-fit:contain;pointer-events:none}
.brand b{display:block;font-size:19px;font-weight:700;white-space:nowrap}
.brand small{display:block;font-size:12px;color:#C9CDD3}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid #3A3F47;background:var(--ink2);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.search{display:flex;gap:10px;margin-top:16px}
.search label{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:0 14px;height:48px;color:var(--mut)}
.search input{border:0;outline:0;flex:1;min-width:0;font-size:15px;background:transparent;color:var(--ink)}
.fbtn{width:48px;height:48px;border-radius:12px;border:0;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;position:relative}
.fbtn i{position:absolute;top:8px;left:8px;width:8px;height:8px;border-radius:50%;background:#fff;display:none}
.fbtn.on i{display:block}
.sub{background:var(--card);border-bottom:1px solid var(--line);padding:calc(12px + var(--safe-t)) 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.sub h1{margin:0;font-size:19px}
.back{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;text-decoration:none;flex:none}
main{padding:16px}
.sec{margin:20px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2{margin:0;font-size:17px}
.sec a{font-size:13px;font-weight:600;text-decoration:none}
/* الشرائح */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 18px;border-radius:21px;border:1px solid var(--line2);background:#fff;color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
/* البنر */
.promo{background:var(--ink2);color:#fff;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}
.promo small{display:block;font-size:11px;font-weight:600;color:#FF9AA6}
.promo b{display:block;font-size:16px;margin:2px 0}
.promo span{display:block;font-size:12px;color:#C9CDD3}
.promo a{flex:none;height:40px;padding:0 14px;border-radius:10px;background:var(--red);color:#fff;text-decoration:none;display:flex;align-items:center;font-size:13px;font-weight:700}
.info{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;margin-top:16px}
.info .ic{width:44px;height:44px;border-radius:12px;background:var(--red-l);color:var(--red-d);display:flex;align-items:center;justify-content:center;flex:none}
.info b{display:block;font-size:14px}
.info span{font-size:12px;color:var(--mut)}
/* بطاقات السيارات */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:4/3;background:#E9EAEC;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:8px;right:8px;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;background:var(--ok-bg);color:var(--ok)}
.tag.soon{background:var(--soon-bg);color:var(--soon)}
.tag.red{background:var(--red);color:#fff}
.tag.sold{background:var(--ink);color:#fff}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.cb b{font-size:14px;line-height:1.35}
.cb span{font-size:12px;color:var(--mut)}
.cb em{font-style:normal;font-size:13px;font-weight:700;color:var(--red)}
.cb em.ask{color:var(--wa)}
.fav{position:absolute;top:8px;left:8px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.fav[aria-pressed=true]{color:var(--red)}.fav[aria-pressed=true] svg{fill:var(--red)}
.chip.favchip{border-color:var(--red);color:var(--red)}.chip.favchip[aria-pressed=true]{background:var(--red);color:#fff}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
/* لوحة الفلتر */
.sheet{position:fixed;inset:0;background:rgba(28,31,36,.45);z-index:30;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .box{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + var(--safe-b));max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:18px}
.sheet h4{margin:16px 0 8px;font-size:14px}
.sheet .chips{flex-wrap:wrap}
.sheet .acts{display:flex;gap:10px;margin-top:22px}
/* الأزرار */
.btn{flex:1;height:52px;border-radius:14px;border:0;background:var(--red);color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;cursor:pointer}
.btn.wa{background:var(--wa)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}
/* التفاصيل */
.gal{position:relative;background:#E9EAEC}
.gal .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:4/3}
.gal .track::-webkit-scrollbar{display:none}
.gal .track img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.gal .noimg{width:100%;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.gal .tb{position:absolute;top:calc(12px + var(--safe-t));inset-inline:12px;display:flex;justify-content:space-between}
.gal .tb .fav{position:static;width:44px;height:44px;border-radius:12px;background:#fff}
.gal .tb a,.gal .tb button{width:44px;height:44px;border-radius:12px;background:#fff;border:0;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.gal .cnt{position:absolute;bottom:10px;left:12px;background:rgba(28,31,36,.7);color:#fff;font-size:12px;padding:3px 10px;border-radius:10px}
.dt{padding:18px 16px}
.dt .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dt h1{margin:0;font-size:22px}
.dt .hd span{font-size:13px;color:var(--mut)}
.pill{padding:5px 10px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--ok-bg);color:var(--ok)}
.pill.soon{background:var(--soon-bg);color:var(--soon)}
.pill.red{background:var(--red);color:#fff}
.price{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.price div+div{border-right:1px solid var(--line);padding-right:12px}
.price small{display:block;font-size:11px;color:var(--mut)}
.price b{font-size:17px}
.price .p1{color:var(--red)}
.price.one{grid-template-columns:1fr}
.lbl{font-size:13px;font-weight:600;margin:18px 0 8px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:50%;border:1px solid #C4C8CE;cursor:pointer;padding:0}
.sw button[aria-pressed=true]{outline:3px solid var(--red);outline-offset:2px}
.swn{font-size:13px;color:var(--mut);margin-top:8px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:16px}
.pays{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pays span{padding:6px 12px;border-radius:16px;background:var(--red-l);color:var(--red-d);font-size:12px;font-weight:600}
.note{font-size:12px;color:var(--mut);margin-top:10px}
details.specs{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:16px;overflow:hidden}
details.specs summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.specs summary::-webkit-details-marker{display:none}
details.specs summary:after{content:"+";color:var(--red);font-size:20px;line-height:1}
details.specs[open] summary:after{content:"−"}
.spl{padding:0 16px 14px;font-size:13px}
.spl h5{margin:14px 0 6px;font-size:14px;color:var(--red-d)}
.spl .r{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.spl .r span:first-child{color:var(--mut)}
.spl .r span:last-child{text-align:left;font-weight:600}
.spl li{padding:4px 0}
.spl ul{margin:0;padding-inline-start:18px}
.bar{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + var(--safe-b));display:flex;gap:10px;z-index:10}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;width:100%}
body.has-bar{padding-bottom:calc(90px + var(--safe-b))}
body.has-bar nav.tabs,body.has-bar .fab{display:none}
/* النموذج */
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;margin-top:14px}
.form input,.form select{height:50px;border-radius:12px;border:1px solid var(--line2);padding:0 14px;font-weight:400;font-size:15px;background:#fff;color:var(--ink);width:100%}
.form input:focus,.form select:focus{outline:2px solid var(--red);outline-offset:0;border-color:var(--red)}
.form .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .two label{margin-top:14px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{height:46px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--ink);font-size:13px;cursor:pointer;padding:0 6px}
.seg button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.hint{background:var(--red-l);color:#8A0B20;border-radius:12px;padding:10px 14px;font-size:13px;margin-top:14px}
.obox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 14px}.orow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.form .orow label{flex:1;margin:0;font-weight:400;font-size:14px}.form .orow input{width:110px;height:44px;border-radius:10px;padding:0 10px;text-align:center}.form .orow input:disabled{background:var(--bg);color:var(--mut)}.orow em{font-style:normal;color:var(--mut);font-size:13px}.otot{display:flex;justify-content:space-between;padding:12px 0 8px;font-size:14px}.otot b{color:var(--red)}.err{color:var(--red-d);font-size:13px;margin-top:10px;display:none}
.mini{display:flex;gap:12px;align-items:center}
.mini img,.mini .ph0{width:72px;height:54px;border-radius:10px;object-fit:cover;background:#E9EAEC;flex:none}
.mini b{display:block;font-size:14px}
.mini span{font-size:12px;color:var(--mut)}
/* التواصل */
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cgrid a{text-decoration:none;border-radius:14px;height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:#fff}
.irow{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.irow svg{flex:none;margin-top:2px;color:var(--red)}
.irow b{display:block;font-size:14px}
.irow span{font-size:12px;color:var(--mut)}
.banks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.banks span{padding:5px 10px;border-radius:14px;background:var(--bg);font-size:12px}
.lnk{height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px;margin-top:12px}
/* الشريط السفلي */
nav.tabs{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(8px + var(--safe-b));z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs a{text-decoration:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:11px}
nav.tabs a.on{color:var(--red);font-weight:700}
.fab{position:fixed;left:16px;bottom:calc(88px + var(--safe-b));width:56px;height:56px;border-radius:50%;background:var(--wa);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(28,31,36,.25);z-index:9}
.alist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.arow{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px}
.ainfo{flex:1;min-width:0;display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink)}
.ainfo img,.ainfo .ph0{width:78px;height:60px;border-radius:10px;object-fit:cover;background:#E9EAEC;flex:none;display:block}
.ainfo>span{display:flex;flex-direction:column;gap:4px;min-width:0}.ainfo b{font-size:14px}.ainfo small{display:flex;gap:6px;flex-wrap:wrap}.ainfo em{font-style:normal;font-size:12px;font-weight:700;color:var(--red)}
.t{font-style:normal;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600;background:var(--bg);color:var(--mut)}.t.on{background:var(--ok-bg);color:var(--ok)}.t.hid{background:var(--ink);color:#fff}.t.sold{background:var(--soon-bg);color:var(--soon)}
.tog{width:52px;height:32px;border-radius:16px;border:0;background:#C4C8CE;position:relative;flex:none;cursor:pointer}.tog span{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .15s}
.tog[aria-checked=true]{background:var(--wa)}.tog[aria-checked=true] span{right:24px}
.egrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.eadd,.eimg{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative}
.eadd{border:2px dashed var(--red);background:var(--red-l);color:var(--red-d);display:flex!important;flex-direction:column!important;align-items:center;justify-content:center;gap:4px;margin:0!important;font-size:12px;cursor:pointer}
.eimg img{width:100%;height:100%;object-fit:cover;display:block}
.edel{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(28,31,36,.75);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.cav{background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 14px}.cr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.cd{width:26px;height:26px;border-radius:50%;border:1px solid #C4C8CE;flex:none}.cn{flex:1;font-size:14px}.form .cs{width:auto;height:42px;font-size:13px;padding:0 8px}.cplus{width:100%;height:46px;border:0;background:none;color:var(--red);font:inherit;font-weight:700;cursor:pointer}
.form label.agree{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;font-size:13px;line-height:1.6;margin-top:18px;color:var(--ink)}
.form label.agree input{width:22px;height:22px;min-width:22px;accent-color:var(--red);margin-top:1px}
.hseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.hseg button{height:42px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-size:13px;cursor:pointer}
.hseg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.htxt{width:100%;min-height:230px;border-radius:12px;border:1px solid var(--line2);padding:12px;font:inherit;font-size:14px;line-height:1.8;resize:vertical;box-sizing:border-box}
.himgs{display:flex;gap:6px;overflow-x:auto;margin-top:10px}.himgs img{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none}
.load{padding:60px 20px;text-align:center;color:var(--mut)}
.toast{position:fixed;bottom:calc(100px + var(--safe-b));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;display:none}
</style>
</head>

<script>

  var seen={};try{seen=JSON.parse(sessionStorage.getItem("sama_app_seen")||"{}")}catch(e){}

  function send(o){var f={};o.t=Date.now();for(var k in o){if(o[k]==null||o[k]==="")continue;f[k]=typeof o[k]==="number"?{integerValue:String(Math.round(o[k]))}:{stringValue:String(o[k]).slice(0,1500)}}

  function ev(kind,ref){if(isOwner())return;var k=kind+"|"+(ref||"");if(seen[k])return;mark(k);send({kind:kind,ref:ref||"",src:"app"})}

function u8b64(u){var b="";for(var i=0;i<u.length;i+=32768)b+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(b)}
function ghGetJson(path){return fetch(GH+path+"?ref=main&t="+Date.now(),{headers:ghHdr(),cache:"no-store"}).then(function(r){if(!r.ok)throw r.status;return r.json()}).then(function(j){
  var bin=atob(j.content.replace(/\n/g,"")),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return {sha:j.sha,data:JSON.parse(new TextDecoder().decode(u))}})}
function ghPut(path,b64,msg,sha){var body={message:msg,content:b64,branch:"main"};if(sha)body.sha=sha;return fetch(GH+path,{method:"PUT",headers:ghHdr(),body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw r.status;return r.json()})}
/* يحفظ تعديل سيارة وحدة في data.json بدون ما يلمس الباقي */
function saveCar(c,patch,tries){tries=tries||0;var key=ck(c),base=idx(c)<NBASE;
  return ghGetJson("data.json").then(function(g){var D=g.data||{},o;
    if(base){D.ov=D.ov||{};o=D.ov[key]=D.ov[key]||{}}
    else{D.extra=D.extra||[];o=D.extra.filter(function(x){return (x.b+" "+x.n)===key})[0];if(!o)throw "missing"}
    if("price" in patch){if(patch.price>0)o.price=patch.price;else delete o.price}
    if("pm" in patch){if(patch.pm)o.pm=patch.pm;else delete o.pm}
    if("status" in patch){if(patch.status)o.status=patch.status;else delete o.status}
    if("badge" in patch){if(patch.badge)o.badge=patch.badge;else delete o.badge}
    if(patch.cimgs){o.cimgs=o.cimgs||{};for(var k in patch.cimgs)o.cimgs[k]=patch.cimgs[k]}
    if(patch.colors){o.colors=patch.colors;o.call=patch.call;if(patch.csoon.length)o.csoon=patch.csoon;else delete o.csoon}
    var txt=JSON.stringify(D,null,1);
    return ghPut("data.json",u8b64(new TextEncoder().encode(txt)),"تعديل من التطبيق: "+key,g.sha).then(function(){
      /* نحدّث النسخة اللي في الجوال على طول */
      if("price" in patch)c.price=patch.price>0?patch.price:0;if("pm" in patch)c.pm=patch.pm||"";if(c.pm==="hide")c.price=0;
      if("status" in patch)c.status=patch.status||"";if("badge" in patch)c.badge=patch.badge||"";
      if(patch.cimgs){c.cimgs=c.cimgs||{};for(var k2 in patch.cimgs)c.cimgs[k2]=patch.cimgs[k2]}
      if(patch.colors){c.colors=patch.colors.slice();c.allColors=patch.call.slice();c.csoon=patch.csoon.slice()}})
  }).catch(function(e){if(e===409&&tries<2)return saveCar(c,patch,tries+1);throw e})}

function shrink(file){return new Promise(function(ok,no){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var m=1600,w=img.naturalWidth,h=img.naturalHeight,r=Math.min(1,m/Math.max(w,h));
  var cv=document.createElement("canvas");cv.width=Math.round(w*r);cv.height=Math.round(h*r);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);
  cv.toBlob(function(b){b?b.arrayBuffer().then(function(a){ok(new Uint8Array(a))}):no("img")},"image/jpeg",.82)};img.onerror=function(){no("img")};img.src=u})}
function uploadImg(file){return shrink(file).then(function(u){var path="up/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";return ghPut(path,u8b64(u),"صورة من التطبيق").then(function(){return path})})}
